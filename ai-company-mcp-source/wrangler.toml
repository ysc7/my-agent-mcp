name = "ai-company-mcp"
main = "src/index.ts"
compatibility_date = "2025-03-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp"]

[[d1_databases]]
binding = "DB"
database_name = "ai-company-mcp"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
